# nginx: black-dragon.online -> игровой сервер (node, порт 8090)
# Установка: sudo cp deploy/black-dragon.online.conf /etc/nginx/sites-available/
#            sudo ln -s /etc/nginx/sites-available/black-dragon.online.conf /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# Сертификат: sudo certbot --nginx -d black-dragon.online -d www.black-dragon.online
# (certbot сам допишет в этот файл блок для 443 и редирект с http на https)

server {
    listen 80;
    listen [::]:80;
    server_name black-dragon.online www.black-dragon.online;

    access_log /var/log/nginx/black-dragon-access.log;
    error_log /var/log/nginx/black-dragon-error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket комнат
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
