<meta name="theme-color" content="#120707">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0b0813;--panel:#171027;--panel2:#20173a;--line:#3b3556;--line2:#5a4e86;--fg:#f4f0ff;--mid:#a99fc9;--dim:#4a4268;--gold:#ffd23f;--gold2:#c58b2b;--red:#e34540;--green:#52bb4e;--blue:#4283ea;--purple:#a95bdc;--pf:'Press Start 2P','Courier New',monospace;--tx:'Rubik','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#1b1331 0%,#0b0813 65%) fixed;color:var(--fg);font-family:var(--tx);font-size:13px;line-height:1.35;font-weight:400;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#0b0813}::-webkit-scrollbar-thumb{background:#3b3556;border:1px solid #0b0813}::-webkit-scrollbar-thumb:hover{background:#5a4e86}
.pf{font-family:var(--pf);font-weight:400}
#app{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:8px;padding:8px;height:100vh}
#left{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.panel,#top,#info,#log{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px #0a0714,0 3px 0 #05030a}
#top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-color:var(--gold2);padding:5px 9px;font-family:var(--pf);font-size:8px}
#top .sp{flex:1}
#top .loc{font-size:10px;color:var(--gold);text-shadow:2px 2px 0 #000;letter-spacing:.5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#0d0818;border:1px solid var(--line);padding:3px 6px;font-family:var(--pf);font-size:8px;color:var(--fg);white-space:nowrap}
.chip.gold{color:var(--gold);border-color:#6b5514}
.coin{display:inline-block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd23f 45%,#c58b2b);border:1px solid #7a4f0f;box-shadow:0 0 5px rgba(255,210,63,.5)}
.keys{display:inline-flex;gap:5px;align-items:center;background:#0d0818;border:1px solid var(--line);padding:3px 8px 3px 6px}
.keys .lb{margin-right:2px;color:var(--mid)}
.gem{display:inline-block;width:9px;height:9px;transform:rotate(45deg);border:2px solid #6b5514;background:#1a1228}
.gem.on{background:linear-gradient(135deg,#fff3b0,#ffd23f 50%,#c58b2b);border-color:#fff3b0;box-shadow:0 0 6px var(--gold)}
.chip.obj{color:#9fe0ff;border-color:#24566b;cursor:help}.chip.obj.ok{color:#8af58a;border-color:#2c7d3a}.chip.obj.bad{color:#ff9a8a;border-color:#7a2a2a}
.rec{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}.rec th,.rec td{border:1px solid var(--line);padding:3px 6px;text-align:center}.rec th{color:var(--gold);font-family:var(--pf);font-size:7px;background:#0d0818}
.relics{display:inline-flex;gap:2px;align-items:center}
.ric{width:24px;height:24px;image-rendering:pixelated;background:#0a0714;border:1px solid #6b5514;cursor:help}
.boss{display:inline-flex;align-items:center;gap:6px;color:#ff8a7a}
.bbar{width:110px;height:10px;background:#1a0a0e;border:1px solid #5a1420;position:relative}
.bbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff7a6a,#c42a2a)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:#05030a;position:relative;box-shadow:inset 0 0 0 1px #0a0714,0 3px 0 #05030a}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair}
#stage canvas{touch-action:none}
#info{padding:6px 10px;height:84px;overflow-y:auto;flex:none;color:var(--fg);font-size:13.5px;line-height:1.35}
#info b{font-family:var(--pf);font-size:9px;color:var(--gold)}
#logbar{display:flex;justify-content:space-between;align-items:center;color:var(--mid);font-family:var(--pf);font-size:7px;margin-bottom:-4px}
#log{padding:5px 10px;height:118px;overflow-y:auto;color:#b9b0d6;position:relative;font-size:12.5px;line-height:1.3}
#log.big{height:320px}
#log div{border-left:2px solid transparent;padding-left:6px}
#log div:last-child{color:var(--fg)}
#log .h{color:var(--gold);border-left-color:var(--gold2);font-family:var(--pf);font-size:8px;line-height:1.9;margin-top:2px}
#log .k{color:#ff8a7a;border-left-color:#8f2233}#log .g{color:#7ee07a;border-left-color:#2c7d3a}#log .y{color:#ffdc7a;border-left-color:#c58b2b}#log .m{color:#c9a8ff;border-left-color:#5f2d8f}
#zoombtns{position:absolute;right:8px;top:8px;flex-direction:column;gap:4px;z-index:3}
#zoombtns .btn{width:30px;height:30px;padding:0;font-size:14px;line-height:1;font-family:var(--tx)}
#toast{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:2}
#toast div{background:rgba(14,9,28,.92);border:2px solid var(--gold2);padding:3px 9px;transition:opacity .6s;max-width:70vw;font-size:12.5px;box-shadow:0 2px 0 #000}
#banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:4;background:linear-gradient(90deg,transparent,rgba(5,3,10,.78) 20%,rgba(5,3,10,.78) 80%,transparent)}
#banner h1{font-family:var(--pf);font-size:22px;color:var(--gold);text-shadow:3px 3px 0 #000,0 0 18px rgba(255,210,63,.5);letter-spacing:2px;text-align:center}
#banner p{white-space:pre-line;margin-top:8px;font-size:16px;color:#d8cff5;text-shadow:2px 2px 0 #000;text-align:center;max-width:80%}
#banner.show{display:flex;animation:bn 2.8s ease both}
@keyframes bn{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
#heroes{display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:0;padding-right:2px}
.card{--cc:#5a4e86;border:2px solid var(--line);border-left:4px solid var(--cc);background:linear-gradient(180deg,#201638,#150f26);padding:6px 7px 7px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 0 #05030a;transition:border-color .15s,box-shadow .15s}
.card.cls-priest{--cc:#f0e8a0}.card.cls-rogue{--cc:#8a7ab8}.card.cls-paladin{--cc:#ffd23f}
.card.cls-tank{--cc:#4283ea}.card.cls-sword{--cc:#e34540}.card.cls-archer{--cc:#52bb4e}.card.cls-mage{--cc:#a95bdc}
.card:hover{border-color:var(--line2);border-left-color:var(--cc)}
.card.sel{border-color:var(--gold);border-left-color:var(--cc);box-shadow:0 0 0 1px #6b5514,0 0 14px rgba(255,210,63,.18),0 3px 0 #05030a}
.card.dead{opacity:.45;filter:grayscale(.7)}
.card .hd{display:flex;gap:8px;align-items:center}
.card .pt{position:relative;width:44px;height:44px;flex:none;background:radial-gradient(circle at 50% 35%,#2d2150,#08050f);border:2px solid var(--cc);box-shadow:0 0 8px color-mix(in srgb,var(--cc) 45%,transparent)}
.card .pt img{width:100%;height:100%;image-rendering:pixelated;display:block}
.card .pt .lv{position:absolute;right:-6px;bottom:-6px;min-width:17px;height:17px;background:#0d0818;border:2px solid var(--gold);color:var(--gold);font-family:var(--pf);font-size:7px;display:flex;align-items:center;justify-content:center;line-height:1}
.card .nm{flex:1;min-width:0}
.card .nm b{font-family:var(--pf);font-size:9px;color:#fff;text-shadow:1px 1px 0 #000}
.card .role{color:var(--mid);font-size:11.5px;line-height:1.2;margin-top:3px}
.tagai{color:#8ad8ff;font-size:12px}
.hp{position:relative;height:15px;background:#08050f;border:1px solid #000;margin-top:6px;box-shadow:inset 0 0 0 1px #2a2145}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#8af58a,#38a838 60%,#2a7d2a);transition:width .3s}
.hp i.y{background:linear-gradient(#ffe27a,#d9a21a 60%,#a87a0f)}.hp i.r{background:linear-gradient(#ff8a7a,#d03030 60%,#8f2233)}
.hp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.35) 6px 7px),linear-gradient(rgba(255,255,255,.18),transparent 45%)}
.hp span{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-family:var(--pf);font-size:7px;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000}
.xpb{position:relative;height:7px;background:#08050f;border:1px solid #000;margin-top:3px}
.xpb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#9fd0ff,#3a78d8)}
.xpl{display:flex;justify-content:space-between;color:var(--mid);font-size:11px;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.chips .chip{font-size:7px;padding:2px 5px;background:#0d0818}
.chip.atk{color:#ffb0a0;border-color:#6b2a2a}.chip.def{color:#a0c8ff;border-color:#243e6b}
.chip.st-bad{color:#ff9a8a;border-color:#7a2a2a;background:#2a0e12}
.apline{display:flex;align-items:center;gap:5px;margin-top:5px;font-family:var(--pf);font-size:7px;color:var(--mid)}
.apline .g{display:inline-block;width:10px;height:10px;transform:rotate(45deg);border:2px solid #6b5514;background:#1a1228;margin-right:2px}
.apline .g.on{background:linear-gradient(135deg,#fff3b0,#ffd23f 55%,#c58b2b);border-color:#fff3b0}
.next{color:#8f86ad;font-size:11px;margin-top:3px;line-height:1.2}
.perks{color:var(--gold);font-size:12px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.btn{position:relative;background:linear-gradient(#2b2050,#1b1336);color:var(--fg);border:2px solid var(--gold2);padding:4px 7px;font-family:var(--tx);font-size:12px;font-weight:500;line-height:1.15;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #05030a;transition:transform .06s,background .12s,border-color .12s}
.btn:hover:not(:disabled){background:linear-gradient(#4a3a86,#2d2250);border-color:var(--gold);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 #05030a}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn.act,.btn.primary{background:linear-gradient(#ffe27a,#d9a21a);color:#1a1000;border-color:#fff3b0;font-weight:600}
.btn.act:hover:not(:disabled){background:linear-gradient(#fff0a0,#ecb62a)}
#top .btn,#zoombtns .btn{font-size:11.5px}
.btn.ab{display:inline-flex;align-items:center;gap:5px;padding:2px 7px 2px 3px;border-color:#6d5fa8}
.btn.ab img{width:22px;height:22px;image-rendering:pixelated;background:#0a0714;border:1px solid #3b3556;flex:none}
.btn.ab em{font-style:normal;font-family:var(--pf);font-size:7px;color:#ffe27a;background:#0d0818;border:1px solid #6b5514;padding:2px 4px;margin-left:2px}
.btn.ab.act em{background:#fff3b0;color:#1a1000}
.btn.slot{border-color:#6d5fa8;min-width:104px;text-align:left;display:inline-flex;align-items:center;gap:5px;padding:2px 7px 2px 3px}
.ic{width:22px;height:22px;image-rendering:pixelated;background:#0a0714;border:1px solid #3b3556;flex:none}
.btn.slot.empty{border-style:dashed;color:var(--dim);border-color:var(--dim);box-shadow:none;cursor:default;background:transparent;padding:5px 7px}
.slotw{display:inline-flex}
.btn.x{padding:2px 5px;border-left:0;color:var(--mid)}
.btn.pick{background:linear-gradient(#ffe27a,#d9a21a);color:#1a1000;border-color:#fff3b0;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{box-shadow:0 0 0 3px rgba(255,255,255,.35),0 3px 0 #05030a}}
.st{color:var(--mid);margin:2px 0;font-size:12px}
#tip{position:fixed;z-index:30;pointer-events:none;max-width:260px;background:#0d0818;border:2px solid var(--gold2);padding:5px 9px;font-size:12.5px;line-height:1.3;box-shadow:3px 3px 0 #000;display:none}
#tip b{font-family:var(--pf);font-size:8px;color:var(--gold);display:block;margin-bottom:3px;line-height:1.5}
#tip .cost{color:#ffe27a}
#modal{position:fixed;inset:0;background:rgba(5,3,10,.82);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#modal .box{max-width:660px;width:100%;max-height:92vh;overflow:auto;border:3px solid var(--gold2);background:linear-gradient(180deg,#1c1334,#0c0816);padding:18px 20px;box-shadow:inset 0 0 0 2px #0a0714,inset 0 0 0 3px #3b3556,6px 6px 0 #000,0 0 40px rgba(255,210,63,.08);animation:pop .18s ease-out;font-size:14px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
#modal h1{font-family:var(--pf);font-size:14px;margin-bottom:12px;line-height:1.5;color:var(--gold);text-shadow:2px 2px 0 #000;padding-bottom:8px;border-bottom:2px solid #3b3556;position:relative}
#modal h1::after{content:"";position:absolute;left:0;bottom:-5px;width:46px;height:3px;background:var(--gold)}
#modal h2{font-family:var(--pf);font-size:9px;margin:12px 0 4px;color:#e8ddff}
#modal p,#modal li{margin:4px 0;color:#d6cdee;line-height:1.3}
#modal ul{padding-left:18px}
#modal b{color:#fff}
#modal .row{margin-top:14px}
#modal .btn{font-size:13px;padding:5px 10px}
#mbox input{background:#05030a;color:var(--fg);border:2px solid var(--gold2);padding:7px;font-family:var(--tx);font-size:15px;width:100%;text-transform:none;outline:none}
#mbox input:focus{border-color:var(--gold);box-shadow:0 0 8px rgba(255,210,63,.3)}
.hurtflash{position:fixed;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at center,transparent 50%,rgba(227,69,64,.45));opacity:0}
.hurtflash.on{animation:hf .45s ease-out}
@keyframes hf{from{opacity:1}to{opacity:0}}
body.lost #stage{filter:grayscale(.9) brightness(.65);transition:filter 1.6s}
.sum{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.shs{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:6px}
.sh{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0d0818;border:1px solid var(--line);padding:6px 2px}
.sh img{width:48px;height:48px;image-rendering:pixelated}.sh b{font-family:var(--pf);font-size:7px}.sh span{color:var(--mid);font-size:12px}
.logo{display:flex;justify-content:center}
.logo img{width:126px;image-rendering:pixelated;animation:flt 3.2s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(227,69,64,.5))}
@keyframes flt{50%{transform:translateY(-5px)}}
#modal h1.big{font-size:17px;text-align:center;letter-spacing:1px;margin-top:4px}
#modal h1.big::after{left:50%;margin-left:-23px}
#modal .shop{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item{background:#0d0818;border:1px solid var(--line);padding:6px 7px;display:flex;flex-direction:column;gap:4px}
.item .ih{display:flex;align-items:center;gap:7px}.item .ih>div{flex:1;min-width:0}.item b{font-size:13px}.item .ty{color:var(--mid);font-size:11px}
.item .ds{color:#c3b9e0;font-size:12px;line-height:1.25}.item .row{margin-top:0}.item .pr{font-size:8px}
body.big{font-size:16px}
body.big #app{grid-template-columns:minmax(0,1fr) 430px}
body.big #info{font-size:16.5px;height:104px}body.big #log{font-size:15px;height:150px}
body.big .btn{font-size:15px}body.big #top .btn,body.big #zoombtns .btn{font-size:14px}
body.big .chip{font-size:10px}body.big #top{font-size:10px}body.big #top .loc{font-size:12px}
body.big .card .role,body.big .next,body.big .xpl,body.big .perks,body.big .st{font-size:14px}
body.big .chips .chip,body.big .apline{font-size:9px}body.big .hp span{font-size:9px}
body.big #modal p,body.big #modal li,body.big .item .ds{font-size:15.5px}body.big .item b{font-size:15px}
body.cb .hp i{background:linear-gradient(#a8d4ff,#2f78e0 60%,#1f55a8)}
body.cb .hp i.y{background:linear-gradient(#ffd27a,#f09a10 60%,#b86e00)}
body.cb .hp i.r{background:linear-gradient(#f0a8f0,#c030b8 60%,#7a1a78)}
body.calm .hurtflash{display:none}body.calm #banner.show{animation:none;opacity:1}
body.calm *{transition:none!important}
input[type=range]{padding:0!important;height:26px;accent-color:#ffd23f}
#dock{display:none}
@media(max-width:900px){
  #dock{display:block;position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow-y:auto;z-index:6;background:#0b0813;border-top:2px solid var(--gold2);padding:5px 6px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(0,0,0,.6)}
  #dock:empty{display:none}
  #dock .card{margin:0}
  #dock .role,#dock .next,#dock .xpl,#dock .perks,#dock .xpb{display:none}
  #dock .row{margin-top:4px}
  #heroes .card.indock{display:none}
}
.htabs{display:flex;flex-wrap:wrap;gap:4px;margin:-4px 0 10px}.htabs .btn{font-size:12px;padding:4px 8px}.htabs .btn.on{background:linear-gradient(#ffe27a,#d9a21a);color:#1a1000;border-color:#fff3b0}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px}
.hcard{display:flex;gap:8px;align-items:flex-start;background:#0d0818;border:1px solid var(--line);padding:6px 7px}
.hcard img{width:44px;height:44px;image-rendering:pixelated;flex:none;background:radial-gradient(circle at 50% 40%,#2d2150,#08050f);border:1px solid var(--line)}
.hcard img.sm{width:28px;height:28px}
.hcard b{font-size:13px;color:#fff}.hcard .st2{color:var(--gold);font-size:11.5px;margin:2px 0}.hcard .ds{color:#c3b9e0;font-size:12px;line-height:1.3}
#modal .box.wide{max-width:940px}
#modal .hsec{margin-top:10px}#modal .hsec li{margin:3px 0}
@media(max-width:900px){
  #app{grid-template-columns:1fr;height:auto;overflow:visible;padding:6px;gap:6px}
  body{overflow:auto;font-size:12.5px}
  #stage{height:min(62vh,72vw);flex:none}
  #heroes{overflow:visible;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #top{position:sticky;top:0;z-index:5;gap:4px 6px;padding:4px 6px}
  #top .btn{padding:4px 6px;font-size:11px}
  .keys .lb{display:none}
  #top .loc{font-size:9px}
  .btn{padding:6px 7px}
  .btn.slot{min-width:0}
  #log{height:96px}
  #modal .box{padding:12px;max-height:94vh}
  #modal h1{font-size:11px}
  #banner h1{font-size:15px}
}
@media(max-width:560px){#modal .shop{grid-template-columns:1fr}#heroes{grid-template-columns:1fr}#stage{height:74vw}.bbar{width:70px}}
